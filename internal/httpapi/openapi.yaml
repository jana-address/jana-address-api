openapi: 3.1.0
info:
  title: Jana Address API
  version: 0.1.0
  description: |
    Parses a one-line delivery address into fields: province, city, district, living area,
    street type and name, house, apartment, entrance, floor, landmark.
    Works without a network: the KATO directory is built into the image.
servers:
  - url: http://localhost:8080
paths:
  /api/v1/parse/batch:
    post:
      summary: Batch parsing (the method for the jury)
      description: |
        An array of records in, an array of the same length and in the same order out.
        No record is dropped: a record that could not be parsed gets null fields and confidence 0.
        Also accepts an object with the array in items/records/data/addresses, NDJSON and
        multipart/form-data with the field file. A UTF-8 BOM is allowed. The body is at most 128 MiB
        and at most 1 000 000 records.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { $ref: '#/components/schemas/Input' }
            example:
              - id: rec_00417
                raw_address: город Алматы/Алматы қаласы, Мкр Аксай 3а, 59, кв 70
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
      responses:
        '200':
          description: Results in the input order
          headers:
            X-Records:
              description: Number of records
              schema: { type: integer }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Result' }
              example:
                - id: rec_00417
                  raw_address: город Алматы/Алматы қаласы, Мкр Аксай 3а, 59, кв 70
                  province: Алматы
                  city: Алматы
                  district: Ауэзовский
                  living_area: null
                  street_type: микрорайон
                  street_name: Аксай 3а
                  house: '59'
                  apartment: '70'
                  entrance: null
                  floor: null
                  landmark: null
                  confidence: 0.95
        '400':
          description: The body is empty, is not JSON, or is truncated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '413':
          description: More than 1 000 000 records, or the body is larger than 128 MiB
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/v1/parse:
    post:
      summary: Parse one line for the UI
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [raw_address]
              properties:
                raw_address: { type: string }
            example:
              raw_address: Астанамангликел55
      responses:
        '200':
          description: Fields, highlighting, sources and a suggestion
          content:
            application/json:
              schema:
                type: object
                properties:
                  result: { $ref: '#/components/schemas/Result' }
                  spans:
                    type: array
                    description: Fragments of the input line per field, offsets in UTF-16
                    items:
                      type: object
                      properties:
                        field: { type: string }
                        start: { type: integer }
                        end: { type: integer }
                  sources:
                    type: object
                    description: Where the field comes from
                    additionalProperties:
                      type: string
                      enum: [string, directory, absent]
                  levels:
                    type: object
                    description: >-
                      How a field was matched in the directory: house — the house inside a district border (OSM),
                      neighbors — the nearest numbers on this side of the street are in one district (OSM),
                      street — most houses of the street are in one district (OSM), area — a microdistrict or living area,
                      settlement — the province and district of a settlement (KATO), district — the city and province of the written district
                    additionalProperties:
                      type: string
                      enum: [house, neighbors, street, area, settlement, district]
                  status:
                    type: string
                    enum: [confident, review, unparsed]
                  suggestion:
                    type: string
                    description: The clean address for the hint under the input field
        '400':
          description: No raw_address
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/v1/health:
    get:
      summary: Service state and the KATO directory version
      responses:
        '200':
          description: ok or degraded (the database is unavailable)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [ok, degraded] }
                  version: { type: string }
                  db: { type: string, enum: [ok, down] }
                  directory:
                    type: object
                    properties:
                      origin: { type: string, enum: [embedded, stat.gov.kz] }
                      source_date: { type: string, format: date }
                      sha256: { type: string }
                      rows: { type: integer }
                      offline: { type: boolean }
                      last_check: { type: string, format: date-time }
                      last_error: { type: string }
                  streets:
                    type: object
                    description: >-
                      The OpenStreetMap street directory for the districts of Алматы, Астана, Шымкент and Тараз and 43 more whole cities:
                      source, licence, export date, number of rows and the check on held-out houses (coverage and
                      accuracy of the district by street)
  /livez:
    get:
      summary: The process is alive
      responses:
        '200': { description: ok }
  /readyz:
    get:
      summary: The API is ready to parse (the database is not checked; its state is in /api/v1/health)
      responses:
        '200': { description: ok }
components:
  schemas:
    Input:
      type: object
      properties:
        id: { description: 'Any JSON value, returned as is' }
        raw_address: { type: string }
    Result:
      type: object
      description: Exactly 14 keys in this order. An unknown field is null.
      required: [id, raw_address, province, city, district, living_area, street_type, street_name, house, apartment, entrance, floor, landmark, confidence]
      properties:
        id: { description: As in the input }
        raw_address: { description: As in the input, byte for byte }
        province: { type: [string, 'null'], description: 'Province in direct word order, or a city of republican significance: «Актюбинская область», «Алматы»' }
        city: { type: [string, 'null'], description: 'Name only: «Актобе», «Боралдай»' }
        district: { type: [string, 'null'], description: 'Without the word «район»: «Илийский», «Ауэзовский»' }
        living_area: { type: [string, 'null'], description: 'Microdistrict or residential complex (ЖК), when the street is given separately' }
        street_type: { type: [string, 'null'], enum: [улица, проспект, микрорайон, переулок, квартал, бульвар, шоссе, жилой комплекс, null] }
        street_name: { type: [string, 'null'], description: Without the type, exactly as in the line }
        house: { type: [string, 'null'], description: 'With a fraction and a letter: «1/2», «12а»' }
        apartment: { type: [string, 'null'] }
        entrance: { type: [string, 'null'] }
        floor: { type: [string, 'null'] }
        landmark: { type: [string, 'null'] }
        confidence: { type: number, minimum: 0, maximum: 1, description: '≥ 0.8 confident, 0.5–0.8 review, < 0.5 unparsed' }
    Error:
      type: object
      properties:
        error: { type: string }
