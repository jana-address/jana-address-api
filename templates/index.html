<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jana Address</title>
<style>
:root{--g:#2f8a1e;--gd:#256f17;--gs:#eef6ea;--ink:#16201a;--mu:#6b766f;--ln:#e6e9e4;--bg:#fafbf9;--red:#d63a2f;--am:#c98a00;--r:14px;--f:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.45 var(--f)}
button,input,select{font:inherit}button{cursor:pointer}
.w{width:min(1180px,100% - 32px);margin:0 auto;padding-bottom:40px}
.top{display:flex;justify-content:space-between;padding:12px 4px;color:var(--mu);font-size:12px}
.top>div{display:flex;gap:8px}.chip{border:1px solid var(--ln);background:#fff;border-radius:8px;padding:5px 10px;color:var(--ink)}
.nav{display:flex;align-items:center;gap:18px;background:#fff;border:1px solid var(--ln);border-radius:var(--r);padding:12px 20px;margin-bottom:34px}
.logo{font-weight:800;font-size:20px;color:var(--g);letter-spacing:-.03em;line-height:1}.logo small{display:block;font-size:7px;letter-spacing:.2em}
.nav .ad{color:var(--mu);border-left:1px solid var(--ln);padding-left:14px}
.tabs{display:flex;gap:30px;margin:0 auto;transform:translateX(-30px)}
.tabs button{border:0;background:none;color:var(--ink);padding:4px 0}.tabs .on{color:var(--g)}
h1{font-size:26px;letter-spacing:-.02em;margin:0 0 6px}.sub{color:var(--mu);max-width:56ch;margin:0 0 20px}
.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:14px;align-items:start}
.card{background:#fff;border:1px solid var(--ln);border-radius:var(--r);padding:18px}
.card h3{font-size:14px;margin:0 0 12px}
.drop{border:1.5px dashed var(--g);background:var(--gs);border-radius:12px;padding:44px 16px;text-align:center;cursor:pointer}
.drop.hot{background:#dcefd5}.drop b{display:block;font-size:14px;margin:10px 0 4px}.drop span{color:var(--mu);font-size:11px;display:block;margin-bottom:12px}
.btn{background:var(--g);color:#fff;border:0;border-radius:8px;padding:8px 16px;font-weight:600}.btn:hover{background:var(--gd)}
.btn.o{background:#fff;color:var(--g);border:1px solid var(--g)}.btn.o:hover{background:var(--gs)}.btn.s{background:#eef0ec;color:var(--ink)}
.note{color:var(--mu);font-size:11px;margin:12px 0 0}
.rec{margin-top:22px}.rec h3{margin:0 0 10px}
.up{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 4px;border-top:1px solid var(--ln);cursor:pointer}
.up:hover{background:var(--bg)}.up small{color:var(--mu)}.up .st{font-size:11px;color:var(--mu);text-align:right}
.row{display:flex;gap:8px}.row input{flex:1;min-width:0;border:1.5px solid var(--g);border-radius:8px;padding:8px 10px;background:#fff}
.raw{background:#f1f2ef;border-radius:10px;padding:10px 12px;margin:12px 0 8px}.raw small{color:var(--mu);font-size:10px;display:block}.raw p{margin:2px 0 0;font-weight:600;font-size:14px}
mark{background:#fff0b3;border-radius:3px;padding:0 2px}
.leg{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:10px;color:var(--mu);margin-bottom:12px}
.fl{display:grid;grid-template-columns:90px 1fr auto;gap:6px 8px;align-items:center}
.fl label{color:var(--mu);font-size:11px}.fl input{border:1px solid var(--ln);border-radius:6px;padding:5px 8px;width:100%;background:#fff}
.tag{font-size:10px;border-radius:6px;padding:2px 7px;background:#e4f1de;color:var(--gd);white-space:nowrap}.tag.d{background:#dff0e8;color:#1c6e57}.tag.n{background:#f0f1ee;color:var(--mu)}
.cf{display:flex;justify-content:space-between;margin-top:12px;color:var(--mu)}
.pill{font-weight:600;border-radius:6px;padding:1px 7px;font-size:11px}.hi{background:#e4f1de;color:var(--gd)}.md{background:#fff0c8;color:var(--am)}.lo{background:#fde3e0;color:var(--red)}
.hd{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px}.hd h2{margin:0;font-size:18px}.hd p{margin:2px 0 0;color:var(--mu);font-size:11px}
.st4{display:flex;gap:44px;padding:16px 22px;margin-bottom:12px}.st4 b{display:block;font-size:24px;letter-spacing:-.02em}.st4 span{color:var(--mu);font-size:11px}
.bar{display:flex;gap:8px;align-items:center;margin-bottom:10px}.bar .sp{flex:1}
.f{border:1px solid var(--ln);background:#fff;border-radius:999px;padding:4px 12px;font-size:11px}.f.on{background:#16201a;color:#fff;border-color:#16201a}
.bar input{border:1px solid var(--ln);border-radius:8px;padding:6px 10px;width:230px}
table{width:100%;border-collapse:collapse;font-size:12px}th{color:var(--mu);font-weight:500;text-align:left;font-size:10px;padding:8px 6px;background:var(--bg)}
td{padding:11px 6px;border-top:1px solid var(--ln)}tr.r{cursor:pointer}tr.r:hover td{background:var(--bg)}tr.sel td{background:#eaf5e4}td.id{color:var(--mu)}
.res{display:grid;grid-template-columns:1fr 340px;gap:14px;align-items:start}
.warn{background:#fff6e0;border:1px solid #f3dca0;border-radius:8px;padding:8px 10px;color:#7a5a00;font-size:11px;margin:10px 0 14px}
.acts{display:flex;gap:8px;margin-top:14px}.close{border:0;background:none;color:var(--mu);font-size:16px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#16201a;color:#fff;padding:10px 16px;border-radius:10px;opacity:0;transition:.2s;pointer-events:none}.toast.on{opacity:1}
[hidden]{display:none!important}
@media(max-width:900px){.grid,.res{grid-template-columns:1fr}.st4{flex-wrap:wrap;gap:18px}.nav{flex-wrap:wrap}.tabs{transform:none;margin:0}table{display:block;overflow-x:auto}.bar{flex-wrap:wrap}.bar input{width:100%}}
</style>
</head>
<body>
<div class="w">
 <div class="top">
  <select class="chip" id="lang"><option value="ru">Русский</option><option value="kk">Қазақша</option><option value="en">English</option></select>
  <div><span class="chip" data-i="help"></span><span class="chip" data-i="op"></span></div>
 </div>
 <div class="nav"><div class="logo">JAŃA<small>POST</small></div><span class="ad">Address</span>
  <div class="tabs"><button data-go="up" class="on" data-i="n1"></button><button data-go="res" data-i="n2"></button><button data-go="dir" data-i="n3"></button></div></div>

 <section id="up">
  <h1 data-i="title"></h1><p class="sub" data-i="sub"></p>
  <div class="grid">
   <div>
    <div class="card"><div class="drop" id="drop"><div>⬆</div><b data-i="drop"></b><span data-i="dsub"></span><button class="btn" data-i="choose"></button></div>
     <p class="note">ⓘ <span data-i="api"></span></p><input type="file" id="file" accept=".json" hidden></div>
    <div class="rec"><h3 data-i="recent"></h3><div class="card" style="padding:4px 14px" id="recent"></div></div>
   </div>
   <div class="card"><h3 data-i="check"></h3>
    <div class="row"><input id="one" value="город Алматы/Алматы қаласы, Мкр Аксай 3а, 59 , кв 70"><button class="btn" id="go" data-i="parse"></button></div>
    <div class="raw"><small data-i="raw"></small><p id="rawp"></p></div>
    <div class="leg" id="leg"></div><div class="fl" id="fl"></div>
    <div class="cf"><span data-i="conf"></span><span class="pill hi" id="cf">0.91</span></div></div>
  </div>
 </section>

 <section id="res" hidden>
  <div class="res"><div>
   <div class="hd"><div><h2 id="fn">sample_input.json</h2><p id="meta"></p></div><button class="btn o" data-i="exp"></button></div>
   <div class="card st4" id="st4"></div>
   <div class="bar" id="bar"><button class="f on" data-k="all"></button><button class="f" data-k="rev"></button><button class="f" data-k="bad"></button><button class="f" data-k="ok"></button><span class="sp"></span><input id="q"></div>
   <div class="card" style="padding:0;overflow:hidden"><table><thead><tr><th>ID</th><th data-i="c1"></th><th data-i="c2"></th><th data-i="c3"></th></tr></thead><tbody id="tb"></tbody></table></div>
  </div>
  <div class="card" id="det"></div></div>
 </section>
 <section id="dir" hidden><h1 data-i="n3"></h1><p class="sub">—</p></section>
</div>
<div class="toast" id="toast"></div>

<script>
const D={
ru:{help:'Помощь',op:'Оператор',n1:'Загрузка',n2:'Результаты',n3:'Справочник',title:'Разбор адресов',sub:'Загрузите JSON в формате sample_input.json — получите поля для логистики и список записей, которые стоит проверить вручную.',drop:'Перетащите файл сюда',dsub:'JSON до 10 000 записей · формат sample_input.json',choose:'Выбрать файл',api:'Пакетно через API: POST /api/v1/parse/batch — тот же формат, ответ как на sample_output.json',recent:'Последние загрузки',check:'Проверить одну строку',parse:'Разобрать',raw:'Исходная строка',conf:'Уверенность разбора',leg:['Место','Улица','Номер дома','Кв., подъезд, этаж','Ориентир'],fld:['Область','Город','Район','Тип улицы','Улица','Дом','Квартира'],dir:'справочник',str:'из строки',none:'нет в строке',exp:'Экспорт JSON',s1:'Всего записей',s2:'Уверенно',s3:'Проверить',s4:'Не разобрано',s5:'Средняя уверенность',all:'Все',rev:'Проверить',bad:'Не разобрано',ok:'Уверенно',q:'Поиск по адресу или ID',c1:'Исходная строка',c2:'Разбор',c3:'Уверенность',meta:'1 000 записей · разобрано за 41 с',save:'Сохранить и далее',skip:'Пропустить',keys:'Enter — сохранить · Tab — следующее поле',rec:'Запись 2 из 71 на проверке',w:'Номер микрорайона мог попасть в «Дом». Сверьте поля «Улица» и «Дом» с исходной строкой.',more:['Область','Город','Район','Жилой массив','Тип улицы','Улица','Дом','Квартира','Подъезд','Этаж','Ориентир'],loaded:'Файл загружен: ',st:(a,b,c)=>`Уверенно ${a} · Проверить ${b} · Не разобрано ${c}`},
kk:{help:'Көмек',op:'Оператор',n1:'Жүктеу',n2:'Нәтижелер',n3:'Анықтамалық',title:'Мекенжайларды талдау',sub:'sample_input.json форматындағы JSON файлын жүктеңіз — логистикаға қажет өрістерді және қолмен тексеру керек жазбалар тізімін аласыз.',drop:'Файлды осында сүйреңіз',dsub:'10 000 жазбаға дейінгі JSON · sample_input.json форматы',choose:'Файлды таңдау',recent:'Соңғы жүктеулер',check:'Бір жолды тексеру',parse:'Талдау',raw:'Бастапқы жол',conf:'Талдау сенімділігі',leg:['Орын','Көше','Үй нөмірі','Пәтер, кіреберіс, қабат','Бағдар'],fld:['Облыс','Қала','Аудан','Көше түрі','Көше','Үй','Пәтер'],dir:'анықтамалық',str:'жолдан',none:'жолда жоқ',exp:'JSON экспорты',s1:'Барлық жазба',s2:'Сенімді',s3:'Тексеру',s4:'Талданбады',s5:'Орташа сенімділік',all:'Барлығы',rev:'Тексеру',bad:'Талданбады',ok:'Сенімді',q:'Мекенжай немесе ID бойынша іздеу',c1:'Бастапқы жол',c2:'Талдау нәтижесі',c3:'Сенімділік',meta:'1 000 жазба · 41 с ішінде талданды',save:'Сақтау және келесі',skip:'Өткізіп жіберу',keys:'Enter — сақтау · Tab — келесі өріс',rec:'Тексеруде: 71 жазбаның 2-сі',loaded:'Файл жүктелді: '},
en:{help:'Help',op:'Operator',n1:'Upload',n2:'Results',n3:'Directory',title:'Address parsing',sub:'Upload a JSON file in sample_input.json format to get logistics-ready fields and a list of records worth checking by hand.',drop:'Drop a file here',dsub:'JSON up to 10,000 records · sample_input.json format',choose:'Choose file',api:'Batch via API: POST /api/v1/parse/batch — same format, response as in sample_output.json',recent:'Recent uploads',check:'Check a single line',parse:'Parse',raw:'Raw string',conf:'Parse confidence',leg:['Place','Street','House number','Apt, entrance, floor','Landmark'],fld:['Region','City','District','Street type','Street','House','Apartment'],dir:'directory',str:'from string',none:'not in string',exp:'Export JSON',s1:'Total records',s2:'Confident',s3:'Review',s4:'Unparsed',s5:'Average confidence',all:'All',rev:'Review',bad:'Unparsed',ok:'Confident',q:'Search by address or ID',c1:'Raw string',c2:'Parsed',c3:'Confidence',meta:'1,000 records · parsed in 41 s',save:'Save and next',skip:'Skip',keys:'Enter — save · Tab — next field',rec:'Record 2 of 71 in review',w:'The microdistrict number may have landed in “House”. Compare “Street” and “House” with the raw string.',more:['Region','City','District','Residential area','Street type','Street','House','Apartment','Entrance','Floor','Landmark'],loaded:'File loaded: ',st:(a,b,c)=>`Confident ${a} · Review ${b} · Unparsed ${c}`}};
const T=k=>(D[L]&&D[L][k])||D.ru[k]; let L='ru';
let R=[['rec_00424','жуулы 19','жуулы, 19',.41],['rec_00418','6бквартал 12дом 69квартира','квартал 6б, 12 · кв 69',.58],['rec_00423','Нурсити 2 микрорайон 11дом 5 подьезд 239 кв','мкр Нурсити 2, 11 · под. 5 · кв 239',.84],['rec_00425','Кулманова 133 flat 191','Кулманова, 133 · кв. 191',.72],['rec_00420','Туран 55/6 магазин берекеу 4подьезд 9этаж','Туран, 55/6 · под. 4 · эт. 9',.77],['rec_00419','Ул. Курильская 9 кв 1','ул. Курильская, 9 · кв 1',.84],['rec_00421','город Актобе/Ақтөбе қаласы, Назарбаева, кв 12','Актобе · Назарбаева, 8 · кв 12',.88],['rec_00417','город Алматы/Алматы қаласы, Мкр Аксай 3а, 59 , кв 70','Алматы · мкр. Аксай 3а, 59 · кв 70',.91],['rec_00422','Туркистбский район, Рыбинский переулок, дом 4','Алматы · пер. Рыбинский, 4',.93]];
const U=[['sample_input.json','1 000',41,[912,71,17],'16/10, 14:12'],['train_part_2.json','2 500',48,[2213,241,46],'16/10, 13:05'],['train_part_1.json','2 500',52,[2187,262,51],'16/10, 12:40']];
let sel='rec_00423',flt='all',$=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const cls=c=>c>=.85?'hi':c>=.6?'md':'lo', kind=c=>c>=.85?'ok':c<.5?'bad':'rev';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));const hl=s=>esc(s).replace(/(Мкр [^,]+)/,'<mark>$1</mark>').replace(/, (\d+) ,/,', <mark>$1</mark> ,');
const K=['region','city','district','street_type','street','house','apartment'];
const M=['region','city','district','residential_area','street_type','street','house','apartment','entrance','floor','landmark'];
let metaOv='',SUM={total:1000,confident:912,review:71,unparsed:17,avg:.86};
async function drawOne(){const s=$('#one').value;$('#rawp').innerHTML=hl(s);$('#leg').innerHTML=T('leg').map(x=>`<span>▢ ${x}</span>`).join('');
 let j;try{const r=await fetch('/api/v1/parse',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({raw:s})});j=await r.json()}catch(e){toast('API недоступен');return}
 $('#fl').innerHTML=T('fld').map((n,i)=>{const k=K[i],v=j.parsed[k]||'—',sr=j.sources[k]||'';return `<label>${n}</label><input value="${esc(v)}" readonly><span class="tag ${sr=='directory'?'d':sr?'':'n'}">${sr=='directory'?T('dir'):sr?T('str'):T('none')}</span>`}).join('');
 const c=$('#cf');c.textContent=j.confidence.toFixed(2);c.className='pill '+cls(j.confidence)}
function drawStats(){const n=x=>x.toLocaleString('ru').replace(/\u00a0/g,' ');$('#st4').innerHTML=[[n(SUM.total),'s1',''],[n(SUM.confident),'s2','var(--g)'],[n(SUM.review),'s3','var(--am)'],[n(SUM.unparsed),'s4','var(--red)'],[SUM.avg.toFixed(2),'s5','']].map(a=>`<div><b${a[2]?` style="color:${a[2]}"`:''}>${a[0]}</b><span>${T(a[1])}</span></div>`).join('')}
async function loadFile(f){try{const d=JSON.parse(await f.text()),recs=Array.isArray(d)?d:d.records,t0=performance.now();
 const r=await fetch('/api/v1/parse/batch',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({records:recs})});
 if(!r.ok)throw new Error((await r.json()).error||r.status);const j=await r.json();
 R=j.results.map(x=>[x.id,x.raw,x.display,x.confidence,x.parsed]);SUM=j.summary;sel=R[0][0];flt='all';
 $('#fn').textContent=f.name;metaOv=`${SUM.total} · ${Math.round(performance.now()-t0)} ms`;i18n();toast(T('loaded')+f.name);go('res')}catch(e){toast('Ошибка файла: '+e.message)}}
function drawRecent(){$('#recent').innerHTML=U.map(u=>`<div class="up" data-f="${u[0]}"><div>📄 <b>${u[0]}</b><br><small>${u[1]} · ${u[2]} с</small></div><div class="st">${(T('st')||D.en.st)(...u[3])}<br>${u[4]}</div></div>`).join('')}
function drawTable(){const q=$('#q').value.toLowerCase();$('#tb').innerHTML=R.filter(r=>(flt=='all'||kind(r[3])==flt)&&(r[0]+r[1]+r[2]).toLowerCase().includes(q)).map(r=>`<tr class="r ${r[0]==sel?'sel':''}" data-id="${r[0]}"><td class="id">${r[0]}</td><td>${esc(r[1])}</td><td>${esc(r[2])}</td><td><span class="pill ${cls(r[3])}">${r[3].toFixed(2)}</span></td></tr>`).join('')}
function drawDet(){const r=R.find(x=>x[0]==sel),ex=sel=='rec_00423',v=r[4]?Object.fromEntries(M.map((k,i)=>[i,r[4][k]]).filter(x=>x[1])):(ex?{4:'микрорайон',5:'Нурсити 2',6:'11',7:'239',8:'5'}:{});
 $('#det').innerHTML=`<div class="hd"><div><h2 style="font-size:14px">${r[0]} <span class="pill md">${r[3].toFixed(2)}</span></h2><p>${T('rec')}</p></div><button class="close" data-x>✕</button></div><div class="raw"><small>${T('raw')}</small><p>${esc(r[1])}</p></div>${r[3]<.85?`<div class="warn">⚠ ${T('w')}</div>`:''}<div class="fl">${T('more').map((n,i)=>`<label>${n}</label><input value="${esc(v[i]||'')}" placeholder="—"><span class="tag ${v[i]?'':'n'}">${v[i]?T('str'):T('none')}</span>`).join('')}</div><div class="acts"><button class="btn" data-next>${T('save')} →</button><button class="btn s" data-next>${T('skip')}</button></div><p class="note">${T('keys')}</p>`}
function i18n(){$$('[data-i]').forEach(e=>e.textContent=T(e.dataset.i));$$('#bar .f').forEach(b=>b.textContent=T(b.dataset.k));$('#q').placeholder='⌕ '+T('q');$('#meta').textContent=metaOv||T('meta');document.documentElement.lang=L;
 $$('.chip[data-i]').forEach(e=>e.textContent=(e.dataset.i=='op'?'👤 ':'? ')+T(e.dataset.i));drawOne();drawRecent();drawStats();drawTable();drawDet()}
function go(n){['up','res','dir'].forEach(s=>$('#'+s).hidden=s!=n);$$('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.go==n))}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2200)}
function load(name){$('#fn').textContent=name;toast(T('loaded')+name);go('res')}
$('#lang').onchange=e=>{L=e.target.value;i18n()};
$$('.tabs button').forEach(b=>b.onclick=()=>go(b.dataset.go));
$('#go').onclick=drawOne;$('#one').onkeydown=e=>e.key=='Enter'&&drawOne();
$('#drop').onclick=()=>$('#file').click();
$('#file').onchange=e=>e.target.files[0]&&loadFile(e.target.files[0]);
['dragover','dragenter'].forEach(ev=>$('#drop').addEventListener(ev,e=>{e.preventDefault();$('#drop').classList.add('hot')}));
['dragleave','drop'].forEach(ev=>$('#drop').addEventListener(ev,e=>{e.preventDefault();$('#drop').classList.remove('hot');if(ev=='drop'&&e.dataTransfer.files[0])loadFile(e.dataTransfer.files[0])}));
$('#recent').onclick=e=>{const u=e.target.closest('.up');u&&load(u.dataset.f)};
$$('#bar .f').forEach(b=>b.onclick=()=>{flt=b.dataset.k;$$('#bar .f').forEach(x=>x.classList.toggle('on',x==b));drawTable()});
$('#q').oninput=drawTable;
$('#tb').onclick=e=>{const r=e.target.closest('.r');if(r){sel=r.dataset.id;drawTable();drawDet()}};
$('#det').onclick=e=>{if(e.target.closest('[data-next]')){const rv=R.filter(r=>kind(r[3])!='ok'),i=rv.findIndex(r=>r[0]==sel);sel=rv[(i+1)%rv.length][0];drawTable();drawDet()}if(e.target.closest('[data-x]'))$('#det').innerHTML=''};
i18n();
</script>
</body>
</html>
