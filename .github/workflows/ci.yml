name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26.9"

jobs:
  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_USER: jana
          POSTGRES_PASSWORD: test
          POSTGRES_DB: jana
          POSTGRES_INITDB_ARGS: --locale-provider=builtin --locale=C.UTF-8 --encoding=UTF8
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U jana -d jana"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://jana:test@localhost:5432/jana?sslmode=disable
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - name: go mod verify
        run: go mod verify

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race -count=1 -covermode=atomic -coverprofile=coverage.out ./...

      - name: coverage
        run: go tool cover -func=coverage.out | tail -n 1

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

  build:
    name: build
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: docker compose config
        run: docker compose config --quiet

      - name: build images
        run: |
          docker buildx build --load -t jana-address/api:local --build-arg VERSION="${GITHUB_SHA::7}" .
          docker buildx build --load -t jana-address/db:local ./db
          docker image ls jana-address/*

      - name: smoke test (db + api)
        run: |
          docker compose up -d --wait --no-build db api
          curl -fsS localhost:8080/livez
          curl -fsS localhost:8080/api/v1/health | tee health.json
          grep -q '"db":"ok"' health.json

      - name: logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: cleanup
        if: always()
        run: docker compose down -v
